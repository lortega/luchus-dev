site_name: Valopes Documentation
site_url: https://docs.valopes.com/
theme:
  name: material
  language: es
  favicon: assets/favicon.ico
  logo: assets/logowhite.svg
  palette:
    primary: teal

extra:
  alternate:
    - name: English
      lang: en
      link: /en/
    - name: Español
      lang: es
      link: /es/

plugins:
  - search:
  - i18n:
      docs_structure: folder
      languages:
        - locale: es
          default: true
          name: Español
          build: true
        - locale: en
          default: false
          name: English
          build: true
