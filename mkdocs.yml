site_name: Valopes Documentation
site_url: https://docs.valopes.com/
theme:
  name: material
  language: es

extra:
  alternate:
    - name: English
      lang: en
      link: /en/
    - name: Español
      lang: es
      link: /es/

plugins:
  - i18n:
      docs_structure: folder
      languages:
        - locale: es
          default: true
          name: Español
          build: true
        - locale: en
          default: false
          name: English
          build: true
